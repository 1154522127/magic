# 北京时间工作日 20:08 / 21:08 / 22:08 / 23:08：交易日且当日尚无点则采集 515450 并推送
name: ETF history nightly

on:
  schedule:
    # UTC 12–15 点 :08 = 北京时间 20:08 / 21:08 / 22:08 / 23:08（中国无夏令时）
    - cron: "8 12,13,14,15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: etf-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect if needed
        id: collect
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          CODE=515450
          HISTORY="data/etf_${CODE}_history.json"
          TODAY="$(date +%F)"

          if ! python3 scripts/is_cn_trading_day.py --print; then
            echo "休市或周末，跳过采集"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if python3 -c "
          import json, sys
          from pathlib import Path
          path, today = Path(sys.argv[1]), sys.argv[2]
          if not path.exists():
              sys.exit(1)
          pts = json.loads(path.read_text(encoding='utf-8')).get('points') or []
          sys.exit(0 if any(p.get('date') == today for p in pts) else 1)
          " "$HISTORY" "$TODAY"; then
            echo "今日已有历史点 ($TODAY)，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/collect_etf_valuation.py "$CODE"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.collect.outputs.changed == 'true'
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          HISTORY="data/etf_515450_history.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$HISTORY"
          if git diff --cached --quiet -- "$HISTORY"; then
            echo "无文件变更，跳过提交"
            exit 0
          fi
          DATE="$(python3 -c "import json; print(json.load(open('$HISTORY'))['points'][-1]['date'])")"
          N="$(python3 -c "import json; print(len(json.load(open('$HISTORY'))['points']))")"
          git commit -m "chore: update 515450 valuation history ($DATE, n=$N)"
          git push
